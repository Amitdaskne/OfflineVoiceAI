name: Build OfflineVoiceAI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      
      - name: Download Gemma 2B Model (Offline AI)
        run: |
          mkdir -p app/src/main/assets
          # MediaPipe Compatible Gemma-2B (Int4) Model download
          curl -L -o app/src/main/assets/gemma2-2b-it-cpu-int4.task "https://huggingface.co/MediaPipe/gemma2-2b-it-cpu-int4/resolve/main/gemma2-2b-it-cpu-int4.task"
          
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineVoiceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
