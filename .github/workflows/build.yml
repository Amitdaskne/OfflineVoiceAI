name: Build OfflineVoiceAI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      
      - name: Download and Extract Gemma Task Model
        run: |
          mkdir -p app/src/main/assets
          # Kaggle se sahi .task archive download karo
          curl -L -o gemma.tar.gz "https://www.kaggle.com/api/v1/models/google/gemma/tfLite/gemma-2b-it-gpu-int4/1/download"
          # Extract karo
          tar -xzf gemma.tar.gz
          # Jo bhi .task file nikli hai usko assets me daal do
          find . -name "*.task" -exec cp {} app/src/main/assets/gemma-2b-it-gpu-int4.task \;
          ls -lh app/src/main/assets/
          
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineVoiceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
